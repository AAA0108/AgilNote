<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f4b7c">
<meta name="description" content="テキスト・Markdownの小説を横書き・縦書きで読むビューア">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AgilNote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic&display=swap">
<style>
:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
/* 上に細い操作帯、下に紙面。紙面は横書き＝中央の段組、縦書き＝右から左へ流れる帯 */
:root{
  --paper:#f3f4f1; --sheet:#fbfbf8; --ink:#23252b; --muted:#6b6f78; --rule:#d9dbd6;
  --ai:#2f4b7c; --ai-soft:#e3e8f1; --warn:#8a5a00; --warn-soft:#fbf0d9;
  --f-body:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-goth:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"BIZ UDGothic",ui-monospace,Consolas,monospace;
  --fs:18px; --lh:1.9; --measure:36em; --pgap:0em;
  /* 編集モードの色：書き換えた段落／足した文字／消した場所 */
  --chg-line:#fbf0c6; --chg-add:#f2cf63; --chg-del:#c8441a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16181d; --sheet:#1d2026; --ink:#dcdde0; --muted:#8d929c; --rule:#30343c;
  --ai:#9db4dc; --ai-soft:#263247; --warn:#e2b45c; --warn-soft:#3a2f1a;
  --chg-line:#352f1f; --chg-add:#73591a; --chg-del:#f08a5d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181d; --sheet:#1d2026; --ink:#dcdde0; --muted:#8d929c; --rule:#30343c;
  --ai:#9db4dc; --ai-soft:#263247; --warn:#e2b45c; --warn-soft:#3a2f1a;
  --chg-line:#352f1f; --chg-add:#73591a; --chg-del:#f08a5d; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font-family:var(--f-body);font-weight:600;font-size:20px;letter-spacing:.08em;color:var(--ai);margin-right:4px}
.file{font-size:13px;color:var(--muted);max-width:22em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button,select,.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover,.btn:hover{border-color:var(--ai)}
button:focus-visible,select:focus-visible,input:focus-visible,.btn:focus-within{outline:2px solid var(--ai);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--sheet)}
label.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
label.ctl input[type=range]{width:90px;accent-color:var(--ai)}
label.ctl output{min-width:3.2em;font-variant-numeric:tabular-nums;color:var(--ink)}
.chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.chk input{accent-color:var(--ai)}
.presets{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
details.more{width:100%}
details.more summary{font-size:12px;color:var(--muted);cursor:pointer;list-style:none}
details.more summary::before{content:"▸ "}details.more[open] summary::before{content:"▾ "}
details.more .row{margin-top:8px}
main{flex:1;min-height:0;position:relative}
.stage{height:100%;overflow:auto;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.text{font-family:var(--f-body);font-size:var(--fs);line-height:var(--lh);max-width:var(--measure);margin-inline:auto;font-feature-settings:"palt" 0;word-break:normal;line-break:strict;overflow-wrap:anywhere}
.text.goth{font-family:var(--f-goth)}
.text p{margin:0 0 var(--pgap);white-space:pre-wrap}
.text p.blank{height:calc(var(--fs) * var(--lh))}
.text p.title{font-weight:600;font-size:1.25em;margin-bottom:.4em;color:var(--ai)}
.text p.sep{text-align:center;color:var(--muted)}
.text rt{font-size:.5em;color:var(--muted)}
/* 上部メニューの開閉。1段目（書名・ファイル名・開閉ボタン）は常に表示、たたむとこの1段だけになる */
.head{display:flex;align-items:center;gap:10px 14px;min-width:0}
.head .file{flex:1;min-width:0;max-width:none}
.bar-toggle{flex:none;display:inline-flex;align-items:center;gap:4px}
.bar-toggle .chev{display:inline-block;transition:transform .15s}
.bar-toggle .alert{color:var(--warn);font-weight:700}
.bar .head + .row{margin-top:8px}
.bar.min{padding-block:5px}
.bar.min > :not(.head){display:none!important}
.bar.min .brand{font-size:15px}
.bar.min .bar-toggle{padding:3px 9px}
.bar.min .bar-toggle .chev{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.bar-toggle .chev{transition:none}}
/* 読書／編集の切替と保存（1段目に置き、たたんでも使える） */
.mode{flex:none}
.mode button{padding:4px 10px}
.mode .dot{color:var(--warn);margin-left:2px;font-size:.8em}
.save{flex:none;padding:4px 12px}
.save:not(:disabled){background:var(--ai);color:var(--sheet);border-color:var(--ai);font-weight:700}
.save:disabled{opacity:.45;cursor:default}
.bar.min .mode button,.bar.min .save{padding:3px 9px}
@media (max-width:480px){.head .brand{display:none}}
/* 編集面：原文をそのまま、読書と同じ書体・大きさ・向きで書き換える */
.text.editor{white-space:pre-wrap;outline:none;caret-color:var(--ai);padding-block-end:4em;min-block-size:3em}
.edit-info{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px;align-items:center}
.edit-info b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.edit-info .ok{color:var(--ai)}
.sw{display:inline-block;width:1.6em;height:1em;border-radius:3px;vertical-align:-.15em;margin-right:4px}
.sw.l{background:var(--chg-line)}.sw.a{background:var(--chg-add)}
.swd{text-decoration:underline wavy var(--chg-del);text-underline-offset:.2em;color:var(--ink);margin-right:2px}
::highlight(an-line){background-color:var(--chg-line)}
::highlight(an-add){background-color:var(--chg-add);color:var(--ink)}
::highlight(an-del){text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:var(--chg-del)}
/* Markdown */
.text .md-h{font-weight:600;color:var(--ai);line-height:1.5;margin-block:.3em;text-wrap:balance}
.text h1.md-h{font-size:1.45em}.text h2.md-h{font-size:1.25em}.text h3.md-h{font-size:1.1em}
.text h4.md-h,.text h5.md-h,.text h6.md-h{font-size:1em}
.text strong{font-weight:600}
.text em{font-style:normal;-webkit-text-emphasis:filled sesame;text-emphasis:filled sesame}
.text del{color:var(--muted)}
.text a{color:var(--ai);text-underline-offset:.2em}
.text .md-badlink{text-decoration:underline dotted;color:var(--muted)}
.text code{font-family:var(--f-mono);font-size:.85em;background:var(--ai-soft);border-radius:4px;padding:.05em .3em}
.text .hr{display:flex;justify-content:center;margin-block:.8em}
.text .hr span{inline-size:5em;border-block-start:1px solid var(--muted)}
.text .md-list{margin-block:.3em}
.text .md-list ul,.text .md-list ol{margin:0;padding-inline-start:1.6em}
.text blockquote{margin:.4em 0;padding-inline-start:.9em;border-inline-start:3px solid var(--rule);color:var(--muted)}
.text .hblock{writing-mode:horizontal-tb;overflow:auto;max-width:100%;margin-block:.3em;font-family:var(--f-ui);font-size:.85em;line-height:1.6}
.text pre{margin:0;padding:.7em .9em;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;font-family:var(--f-mono);white-space:pre}
.text pre code{background:none;padding:0;font-size:1em}
.text table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.text th,.text td{border:1px solid var(--rule);padding:.3em .7em;vertical-align:top;white-space:pre-wrap}
.text th{background:var(--ai-soft);font-weight:700}
.text .internal{border:1px dashed var(--muted);border-radius:6px;padding:.3em .9em;margin-block:.6em;background:var(--sheet)}
.text .internal-label,.text .internal-note{font-family:var(--f-ui);font-size:.7em;color:var(--muted);letter-spacing:.05em}
.text .internal-note{margin-block:.4em}
.warn{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 10px;margin-top:6px}
.warn ul{margin:4px 0 0;padding-left:1.4em}
/* 縦書き */
.stage.v{overflow-x:auto;overflow-y:hidden}
.stage.v .text{writing-mode:vertical-rl;text-orientation:mixed;max-width:none;height:100%;max-height:var(--measure);margin:auto 0;margin-left:0}
.stage.v .text p{margin:0 0 0 var(--pgap)}
.stage.v .text p.blank{height:auto;width:calc(var(--fs) * var(--lh))}
.stage.v .tcy{text-combine-upright:all}
.stage.v .text .hblock{width:min(34em,85vw);max-height:100%;margin-block:0 1em}
.drop{position:absolute;inset:12px;border:2px dashed var(--ai);border-radius:12px;background:color-mix(in srgb,var(--ai-soft) 85%,transparent);display:grid;place-items:center;font-size:16px;color:var(--ai);pointer-events:none}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.paste{width:100%;display:grid;gap:8px}
.paste textarea{width:100%;min-height:120px;font:14px/1.7 var(--f-goth);color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:8px;box-sizing:border-box}
.note{font-size:12px;color:var(--muted)}
@media (max-width:600px){label.ctl input[type=range]{width:70px}.file{max-width:12em}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="bar" id="bar">
  <div class="head">
    <span class="brand">AgilNote</span>
    <span class="file" id="fname">見本：アビドス対策委員会杯（冒頭）</span>
    <div class="seg mode" role="group" aria-label="モード">
      <button id="readMode" aria-pressed="true">読書</button><button id="editMode" aria-pressed="false" title="本文を書き換える（保存は Ctrl+S でも）">編集<span class="dot" id="editDot" hidden>●</span></button>
    </div>
    <button class="save" id="saveBtn" hidden disabled title="ファイルに保存（Ctrl+S）">保存</button>
    <button class="bar-toggle" id="barToggle" aria-expanded="true" aria-controls="bar" title="メニューをたたむ（キーボードの M でも切り替え）"><span class="alert" id="barAlert" hidden>！</span><span id="barLabel">たたむ</span><span class="chev" aria-hidden="true">▴</span></button>
  </div>
  <div class="row">
    <label class="btn" for="fileIn" id="openLbl">ファイルを開く<input id="fileIn" type="file" accept=".txt,.md,.markdown,text/plain,text/markdown" hidden></label>
    <select id="fmt" aria-label="形式"><option value="txt">テキスト</option><option value="md">Markdown</option></select>
    <select id="enc" aria-label="文字コード"><option value="utf-8">UTF-8</option><option value="shift_jis">Shift_JIS</option></select>
    <div class="seg" role="group" aria-label="組み方向">
      <button id="hBtn" aria-pressed="true">横書き</button><button id="vBtn" aria-pressed="false">縦書き</button>
    </div>
    <div class="seg" role="group" aria-label="内部記録" id="viewSeg" hidden>
      <button id="readBtn" aria-pressed="true">読書表示</button><button id="fullBtn" aria-pressed="false">全文表示</button>
    </div>
    <div class="presets">見え方
      <button data-preset="site">投稿サイト風</button>
      <button data-preset="chat">チャット画面風</button>
      <button data-preset="book">文庫風</button>
    </div>
  </div>
  <details class="more" id="more">
    <summary>詳しい設定・貼り付け</summary>
    <div class="row">
      <label class="ctl">文字<input id="fs" type="range" min="13" max="28" step="1"><output id="fsO"></output></label>
      <label class="ctl">行間<input id="lh" type="range" min="1.3" max="2.6" step="0.05"><output id="lhO"></output></label>
      <label class="ctl">段落間<input id="pg" type="range" min="0" max="2" step="0.1"><output id="pgO"></output></label>
      <label class="ctl">行の長さ<input id="ms" type="range" min="16" max="50" step="1"><output id="msO"></output></label>
      <select id="face" aria-label="書体"><option value="min">明朝</option><option value="goth">ゴシック</option></select>
      <label class="btn" for="fontIn">書体を追加<input id="fontIn" type="file" accept=".ttf,.otf,.woff,.woff2" multiple hidden></label>
      <button id="fontClear">追加書体を消去</button>
      <label class="chk"><input id="squash" type="checkbox">空行を詰める</label>
      <button id="themeBtn">明暗切替</button>
    </div>
    <div class="row"><div class="paste">
      <textarea id="pasteBox" placeholder="ここに本文を貼り付けて「表示する」"></textarea>
      <div class="row"><select id="pasteFmt" aria-label="貼り付ける本文の形式"><option value="txt">プレーンテキストとして</option><option value="md">Markdownとして</option></select><button id="pasteGo">表示する</button><span class="note">ファイルはこの端末内で読み込むだけで、どこにも送信しません。|漢字《かんじ》のルビ記法に対応。.txt と .md は画面にドラッグしても開けます。</span></div>
    </div></div>
  </details>
  <div class="warn" id="warn" role="status" hidden></div>
  <div class="stats" id="stats" style="margin-top:6px"></div>
  <div class="edit-info" id="editInfo" role="status" hidden></div>
</header>
<main id="main">
  <div class="stage" id="stage"><article class="text" id="text"></article><div class="text editor" id="ed" hidden lang="ja" spellcheck="false" autocapitalize="off" autocorrect="off" translate="no" aria-label="本文の編集" aria-multiline="true" role="textbox"></div></div>
  <div class="drop" id="drop" hidden>ここに .txt / .md をドロップ</div>
</main>

<script src="md.js"></script>
<script src="edit.js"></script>
<script>
const SAMPLE=`アビドス対策委員会杯
～勝負に私情を持ち込まないでください～
　アビドス高等学校の対策委員会室に、見慣れない段ボール箱が置かれていた。
　発見したのは、アルバイトを終えて戻ってきた黒見セリカである。普段ならこの時間、ホシノ先輩がソファで寝ていて、シロコ先輩は自転車の整備をしているか、どこかを走っている。ノノミ先輩はお茶を淹れ、アヤネは机で書類を整理しているはずだった。ところが今日は、部屋の中央に置かれたモニターを四人が取り囲んでおり、誰一人として彼女の帰宅に気づいていない。
「……何してるの？」
「あっ、セリカちゃん！　おかえりなさ～い！」
　ノノミが嬉しそうに振り返った。その手には、テレビゲームのコントローラーが握られている。
「じゃーん！　今日はみんなで、これを遊ぼうと思いまして！」
「……ゲーム？」
「ん。対策委員会の親睦を深めるため」
　シロコが真面目な顔で答えた。その視線はすでにモニターへ戻っており、画面に映るゲームの説明を熱心に読んでいる。
　　　　　◇
　ゲームの名前は『どたばたトレジャーアイランド』。プレイヤーは島に散らばった宝物を自分の拠点へ持ち帰り、制限時間内に最も多くの得点を獲得した者が勝利する。
「ん。銀行はどこ？」
「ありませんよ。宝物を自分の拠点に運ぶゲームです」`;

const PRESETS={
  site:{fs:16,lh:1.8,pg:0,ms:36,face:"goth",squash:false},
  chat:{fs:16,lh:1.75,pg:1.2,ms:42,face:"goth",squash:false},
  book:{fs:18,lh:1.75,pg:0,ms:42,face:"min",squash:true}
};
const $=id=>document.getElementById(id);
let state={fs:17,lh:1.9,pg:0,ms:36,face:"min",squash:false,vert:false,view:"reading",barMin:false};
let raw=SAMPLE, rawBytes=null, fmt="txt";
/* 編集モード：base＝最後に開いた／保存した本文（行を \n でつないだもの）。保存するまで raw は変えない */
let editing=false, dirty=false, base="", baseLines=[""], finalNL=false, eol="\n", bom=false;
let fileHandle=null, fileName=null, curEnc="utf-8", saveMsg="", changes=0;
try{Object.assign(state,JSON.parse(localStorage.getItem("agilnote")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("agilnote",JSON.stringify(state))}catch(e){}};

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function inline(s){
  let h=esc(s);
  h=h.replace(/[|｜]([^|｜《》\n]+?)《([^》\n]+?)》/g,"<ruby>$1<rt>$2</rt></ruby>");
  h=h.replace(/([一-龠々ヶ]+)《([^》\n]+?)》/g,"<ruby>$1<rt>$2</rt></ruby>");
  if(state.vert) h=h.replace(/(^|[^0-9０-９!?！？])([0-9]{2}|[!?！？]{2})(?![0-9!?！？])/g,'$1<span class="tcy">$2</span>');
  return h;
}
function render(){
  $("fmt").value=fmt;
  $("viewSeg").hidden=fmt!=="md"||editing;
  $("readBtn").setAttribute("aria-pressed",state.view!=="full");$("fullBtn").setAttribute("aria-pressed",state.view==="full");
  if(fmt==="md") return renderMd();
  $("warn").hidden=true;
  const lines=raw.replace(/\r\n?/g,"\n").replace(/\n+$/,"").split("\n");
  let out=[],firstText=true;
  lines.forEach((ln,i)=>{
    if(!ln.trim()){ if(!state.squash) out.push('<p class="blank"></p>'); return; }
    let cls="";
    if(/^[\s　]*[◇◆＊*※☆★●○■□]+[\s　]*$/.test(ln)) cls="sep";
    else if(firstText && i===0 && !/^[「『（(　]/.test(ln)) cls="title";
    firstText=false;
    out.push(`<p${cls?` class="${cls}"`:""}>${inline(ln)}</p>`);
  });
  $("text").innerHTML=out.join("");
  stats(lines);
}
/* Markdown：md.js で描画し、表示された構造から統計を取る */
function renderMd(){
  const r=AgilMD.render(raw,{vertical:state.vert,squash:state.squash,view:state.view});
  $("text").innerHTML=r.html;
  const w=$("warn");
  if(r.warnings.length){
    w.innerHTML="内部記録の目印が正しく対応していないため、何も隠さずに全文を表示しています。<ul>"+r.warnings.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";
    w.hidden=false;
  } else w.hidden=true;
  statsMd(r);
}
const plain=el=>{const c=el.cloneNode(true);c.querySelectorAll("rt").forEach(x=>x.remove());return c.textContent.replace(/[\s　]/g,"")};
function statsMd(r){
  let paras=[],other=0;
  for(const el of $("text").children){
    const k=el.dataset.kind;
    if(k==="para") paras.push(plain(el));
    else if(k==="heading"||k==="list"||k==="table"||k==="code"||k==="quote") other+=plain(el).length;
  }
  const isDlg=t=>/^[「『]/.test(t);
  const dlg=paras.filter(isDlg).length, narr=paras.filter(t=>!isDlg(t));
  const bodyChars=paras.join("").length;
  const narrChars=narr.join("").length;
  const short=narr.filter(t=>t.length<=12).length;
  let h=`文字数 <b>${(bodyChars+other).toLocaleString()}</b>　本文段落 <b>${paras.length}</b>　台詞段落 <b>${paras.length?Math.round(dlg/paras.length*100):0}%</b>　地の文の平均 <b>${narr.length?Math.round(narrChars/narr.length):0}</b>字/段落　12字以下の地の文 <b>${short}</b>　その他（見出し・表など） <b>${other.toLocaleString()}</b>字`;
  if(r.internalCount) h+=`　内部記録 <b>${r.internalCount}</b>件（統計外）`;
  $("stats").innerHTML=h;
  $("stats").title="段落の統計は本文の段落だけで数えます。見出し・表・リスト・引用・コードは別に数え、内部記録はどちらの表示でも統計に含めません。";
}
function stats(lines){
  const body=lines.filter(l=>l.trim());
  const chars=body.join("").replace(/[\s　]/g,"").length;
  const dlg=body.filter(l=>/^[\s　]*[「『]/.test(l)).length;
  const narr=body.length-dlg;
  const narrChars=body.filter(l=>!/^[\s　]*[「『]/.test(l)).join("").replace(/[\s　]/g,"").length;
  const short=body.filter(l=>!/^[\s　]*[「『]/.test(l)&&l.replace(/[\s　]/g,"").length<=12).length;
  $("stats").title="";
  $("stats").innerHTML=`文字数 <b>${chars.toLocaleString()}</b>　段落 <b>${body.length}</b>　台詞段落 <b>${body.length?Math.round(dlg/body.length*100):0}%</b>　地の文の平均 <b>${narr?Math.round(narrChars/narr):0}</b>字/段落　12字以下の地の文 <b>${short}</b>`;
}
function apply(){
  const r=document.documentElement.style;
  r.setProperty("--fs",state.fs+"px");r.setProperty("--lh",state.lh);
  r.setProperty("--pgap",state.pg+"em");r.setProperty("--measure",state.ms+"em");
  $("fs").value=state.fs;$("fsO").textContent=state.fs+"px";
  $("lh").value=state.lh;$("lhO").textContent=(+state.lh).toFixed(2);
  $("pg").value=state.pg;$("pgO").textContent=(+state.pg).toFixed(1)+"行";
  $("ms").value=state.ms;$("msO").textContent=state.ms+"字";
  if(![...$("face").options].some(o=>o.value===state.face) && !state.face.startsWith("u:")) state.face="min";
  $("face").value=state.face;
  for(const el of [$("text"),$("ed")]){
    el.classList.toggle("goth",state.face==="goth");
    el.style.fontFamily=state.face.startsWith("u:")?`"${state.face.slice(2)}",var(--f-body)`:"";
  }
  $("text").hidden=editing;$("ed").hidden=!editing;
  $("stats").hidden=editing;$("editInfo").hidden=!editing;$("saveBtn").hidden=!editing;
  $("readMode").setAttribute("aria-pressed",!editing);$("editMode").setAttribute("aria-pressed",editing);
  $("squash").checked=state.squash;
  $("stage").classList.toggle("v",state.vert);
  $("hBtn").setAttribute("aria-pressed",!state.vert);$("vBtn").setAttribute("aria-pressed",state.vert);
  render();save();
  setBar();
}
function setBar(){
  const min=!!state.barMin, b=$("barToggle");
  $("bar").classList.toggle("min",min);
  b.setAttribute("aria-expanded",String(!min));
  $("barLabel").textContent=min?"メニュー":"たたむ";
  b.title=min?"メニューを開く（キーボードの M でも切り替え）":"メニューをたたむ（キーボードの M でも切り替え）";
  $("barAlert").hidden=!(min && !$("warn").hidden);
}
function toggleBar(){
  /* 読んでいる位置を保つ：帯の高さが変わる分だけ本文の位置がずれないようにする */
  const s=$("stage"), top=s.scrollTop, left=s.scrollLeft;
  state.barMin=!state.barMin; setBar(); save();
  s.scrollTop=top; s.scrollLeft=left;
}
/* 読み始めの位置へ。縦書きは右端が冒頭 */
function toStart(){requestAnimationFrame(()=>{const s=$("stage");s.scrollTop=0;s.scrollLeft=state.vert?s.scrollWidth:0})}
["fs","lh","pg","ms"].forEach(k=>$(k).addEventListener("input",e=>{state[k]=+e.target.value;apply()}));
$("face").onchange=e=>{state.face=e.target.value;apply()};
$("squash").onchange=e=>{state.squash=e.target.checked;apply()};
$("barToggle").onclick=toggleBar;
addEventListener("keydown",e=>{
  if(e.key!=="m"&&e.key!=="M") return;
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing) return;
  const t=e.target; if(t&&(t.tagName==="TEXTAREA"||t.tagName==="INPUT"||t.tagName==="SELECT"||t.isContentEditable)) return;
  toggleBar();
});
$("readBtn").onclick=()=>{state.view="reading";apply()};
$("fullBtn").onclick=()=>{state.view="full";apply()};
$("fmt").onchange=e=>{fmt=e.target.value;apply();toStart()};
$("hBtn").onclick=()=>{state.vert=false;apply();toStart()};
$("vBtn").onclick=()=>{state.vert=true;apply();toStart()};
document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{Object.assign(state,PRESETS[b.dataset.preset]);apply()});
$("themeBtn").onclick=()=>{const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;d.dataset.theme=dark?"light":"dark"};

function decode(){ if(!rawBytes) return; curEnc=$("enc").value; try{raw=new TextDecoder(curEnc).decode(rawBytes)}catch(e){raw=new TextDecoder().decode(rawBytes)} resetEditor(); apply(); toStart() }
const fmtOf=name=>/\.(md|markdown)$/i.test(name)?"md":"txt";
/* handle：上書き保存に使うファイルの持ち手（開き方によっては無い） */
async function loadFile(f,handle){ if(!f) return; if(!confirmDiscard()) return;
  fileHandle=handle||null; fileName=f.name; $("fname").textContent=f.name; fmt=fmtOf(f.name);
  const b=await f.arrayBuffer(); rawBytes=b;
  const u8=new Uint8Array(b); bom=u8[0]===0xEF&&u8[1]===0xBB&&u8[2]===0xBF;
  const u=new TextDecoder("utf-8",{fatal:true}); try{u.decode(b);$("enc").value="utf-8"}catch(e){$("enc").value="shift_jis"} decode()}
$("fileIn").onchange=e=>{loadFile(e.target.files[0]);e.target.value=""};
/* 開いたファイルに上書きできるよう、使えるブラウザ（Windows の Edge／Chrome など）ではファイルの持ち手ごと開く */
$("openLbl").addEventListener("click",async e=>{
  if(!window.showOpenFilePicker) return;
  e.preventDefault();
  try{const [h]=await showOpenFilePicker({types:[{description:"テキスト・Markdown",accept:{"text/plain":[".txt"],"text/markdown":[".md",".markdown"]}}]});
    loadFile(await h.getFile(),h)}catch(_){}
});
$("enc").onchange=()=>{ if(!confirmDiscard()){ $("enc").value=curEnc; return } if(rawBytes) decode(); else curEnc=$("enc").value };
$("pasteGo").onclick=()=>{const t=$("pasteBox").value;if(!t.trim())return;if(!confirmDiscard())return;
  raw=t;rawBytes=null;fileHandle=null;fileName=null;bom=false;fmt=$("pasteFmt").value;$("fname").textContent="貼り付けた本文";resetEditor();apply();toStart()};
/* ファイルのドラッグだけを受ける（編集中に文字をドラッグして動かすのは邪魔しない） */
const hasFiles=e=>!!e.dataTransfer&&[...e.dataTransfer.types].includes("Files");
let dc=0;
addEventListener("dragenter",e=>{if(!hasFiles(e))return;e.preventDefault();dc++;$("drop").hidden=false});
addEventListener("dragleave",e=>{if(!hasFiles(e))return;if(--dc<=0){dc=0;$("drop").hidden=true}});
addEventListener("dragover",e=>{if(hasFiles(e))e.preventDefault()});
addEventListener("drop",e=>{if(!hasFiles(e))return;e.preventDefault();dc=0;$("drop").hidden=true;
  const it=e.dataTransfer.items&&e.dataTransfer.items[0], f=e.dataTransfer.files[0];
  const hp=it&&it.getAsFileSystemHandle?it.getAsFileSystemHandle().catch(()=>null):Promise.resolve(null);
  hp.then(h=>loadFile(f,h&&h.kind==="file"?h:null))});

/* ---------- 編集モード ---------- */
const ed=$("ed");
ed.contentEditable="plaintext-only";
if(ed.contentEditable!=="plaintext-only") ed.contentEditable="true";
ed.addEventListener("beforeinput",e=>{if(e.inputType.startsWith("format"))e.preventDefault()});
/* 編集面の文字を読む。ふつうは文字だけだが、ブラウザが改行を <br> や <div> にした場合も 1 行として数える */
function edRead(){
  const segs=[]; let text="";
  (function walk(n){ for(const c of n.childNodes){
    if(c.nodeType===3){segs.push([c,text.length]);text+=c.data}
    else if(c.nodeName==="BR") text+="\n";
    else { if(/^(DIV|P)$/.test(c.nodeName)&&text&&!text.endsWith("\n")) text+="\n"; walk(c) }
  }})(ed);
  /* 末尾の改行 1 つは、最後の行を表示するための置き場（本文には含めない） */
  return {text, segs, body:text.endsWith("\n")?text.slice(0,-1):text};
}
function resetEditor(){
  const n=raw.replace(/\r\n?/g,"\n");
  eol=/\r\n/.test(raw)?"\r\n":/\r/.test(raw)?"\r":"\n";
  finalNL=n.endsWith("\n"); base=finalNL?n.slice(0,-1):n; baseLines=base.split("\n");
  ed.textContent=base+"\n"; saveMsg=""; updateMarks();
}
function rangeOf(segs,s,e){
  const find=p=>{let lo=0,hi=segs.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(segs[m][1]<=p){k=m;lo=m+1}else hi=m-1}
    for(;k>=0;k--){const [nd,st]=segs[k];if(p<=st+nd.data.length) return [nd,p-st]} return null};
  const a=find(s),b=find(e); if(!a||!b) return null;
  const r=new Range(); try{r.setStart(a[0],a[1]);r.setEnd(b[0],b[1])}catch(_){return null} return r;
}
function updateMarks(){
  const {segs,body}=edRead();
  dirty=body!==base;
  const m=dirty?AgilEdit.marks(baseLines,body.split("\n")):{line:[],add:[],del:[],changes:0};
  changes=m.changes;
  if(window.CSS&&CSS.highlights&&window.Highlight){
    const hl=rs=>{const h=new Highlight();for(const r of rs){const g=rangeOf(segs,r[0],r[1]);if(g)h.add(g)}return h};
    const a=hl(m.add),d=hl(m.del.map(p=>AgilEdit.delSpot(body,p)).filter(Boolean));
    a.priority=1;d.priority=2;
    CSS.highlights.set("an-line",hl(m.line));CSS.highlights.set("an-add",a);CSS.highlights.set("an-del",d);
  }
  if(dirty) saveMsg="";
  editUI();
}
function editUI(){
  $("saveBtn").disabled=!dirty;
  $("editDot").hidden=!(dirty&&!editing);
  $("editMode").title=dirty?"保存していない変更があります":"本文を書き換える（保存は Ctrl+S でも）";
  const legend='<span><span class="sw l"></span>書き換えた段落</span><span><span class="sw a"></span>足した文字</span><span><span class="swd">字</span>消した場所</span>';
  $("editInfo").innerHTML=dirty
    ? `編集中　変更 <b>${changes}</b> か所（未保存）${legend}`
    : saveMsg?`<span class="ok">${esc(saveMsg)}</span>`:"編集中　原文のままです。文字をクリックすると書き換えられます";
}
let markTimer=0;
ed.addEventListener("input",e=>{if(e.isComposing)return;clearTimeout(markTimer);markTimer=setTimeout(updateMarks,120)});
ed.addEventListener("compositionend",()=>{clearTimeout(markTimer);markTimer=setTimeout(updateMarks,120)});
function confirmDiscard(){
  if(editing||dirty) updateMarks();
  return !dirty||confirm("保存していない変更があります。変更を捨てて続けますか？");
}
/* 読んでいた辺りを保ったまま切り替える（全体の何割まで進んでいたかで合わせる） */
function scrollRatio(){const s=$("stage");
  if(state.vert){const max=s.scrollWidth-s.clientWidth;return max>0?Math.abs(s.scrollLeft)/max:0}
  const max=s.scrollHeight-s.clientHeight;return max>0?s.scrollTop/max:0}
function setScrollRatio(r){requestAnimationFrame(()=>{const s=$("stage");
  if(state.vert){const max=s.scrollWidth-s.clientWidth;s.scrollLeft=-r*max;if(r>0&&s.scrollLeft===0)s.scrollLeft=r*max}
  else s.scrollTop=r*(s.scrollHeight-s.clientHeight)})}
function setMode(on){
  if(on===editing) return;
  const r=scrollRatio(); editing=on;
  if(on) updateMarks();
  apply(); editUI(); setScrollRatio(r);
}
$("readMode").onclick=()=>setMode(false);
$("editMode").onclick=()=>setMode(true);
$("saveBtn").onclick=()=>saveFile();
addEventListener("keydown",e=>{
  if(editing&&(e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==="s"||e.key==="S")){e.preventDefault();saveFile()}
});
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

/* ---------- 保存 ----------
 * 開いたときの文字コード・BOM・改行コード・末尾の改行を保ったまま書き出す。
 * 書き先：開いたファイル（上書き）→ 保存先を選ぶ画面 → ダウンロード の順に、使えるものを使う */
let saving=false;
async function saveFile(){
  if(saving) return;
  updateMarks(); if(!dirty) return;
  const body=edRead().body;
  let out=body+(finalNL?"\n":""); if(eol!=="\n") out=out.replace(/\n/g,eol);
  let enc=$("enc").value, bytes=null;
  if(enc==="shift_jis"){
    const r=AgilEdit.encodeSjis(out);
    if(r.bad.length){
      const list=r.bad.slice(0,12).join(" ")+(r.bad.length>12?` ほか${r.bad.length-12}種類`:"");
      if(!confirm(`次の文字は Shift_JIS で保存できません：\n${list}\n\nOK：UTF-8 に切り替えて保存する\nキャンセル：保存をやめる（文字を直してから保存し直せます）`)) return;
      enc="utf-8";
    } else bytes=r.bytes;
  }
  if(!bytes){const u=new TextEncoder().encode(out);if(bom){bytes=new Uint8Array(u.length+3);bytes.set([0xEF,0xBB,0xBF]);bytes.set(u,3)}else bytes=u}
  const name=fileName||(raw===SAMPLE?"AgilNote見本.txt":`AgilNote_${new Date().toISOString().slice(0,10)}.${fmt==="md"?"md":"txt"}`);
  let how;
  saving=true;$("saveBtn").disabled=true;
  try{
    if(fileHandle){ await writeTo(fileHandle,bytes); how="上書き" }
    else if(window.showSaveFilePicker){
      const h=await showSaveFilePicker({suggestedName:name,types:[{description:"テキスト・Markdown",accept:{"text/plain":[".txt"],"text/markdown":[".md",".markdown"]}}]});
      await writeTo(h,bytes); fileHandle=h; fileName=h.name; $("fname").textContent=h.name; how="保存";
    } else { download(bytes,name); fileName=name; $("fname").textContent=name; how="ダウンロード" }
  }catch(err){
    saving=false; updateMarks();
    if(err&&err.name==="AbortError") return;
    $("editInfo").innerHTML=`<span style="color:var(--warn)">保存できませんでした：${esc(String(err&&err.message||err))}</span>`;
    return;
  }
  saving=false;
  /* 保存したものを新しい原文にする。読書表示もこれに切り替わる */
  rawBytes=bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);
  curEnc=enc; $("enc").value=enc;
  raw=new TextDecoder(enc).decode(bytes);
  const n=raw.replace(/\r\n?/g,"\n"), nb=finalNL?n.slice(0,-1):n;
  if(nb===body){ base=body; baseLines=base.split("\n") }
  else resetEditor(); /* Shift_JIS で記号を読み替えたときは、ファイルの中身どおりに表示し直す */
  const t=new Date();
  const hm=`${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`, en=enc==="shift_jis"?"Shift_JIS":"UTF-8";
  saveMsg=how==="上書き"?`保存しました（${hm}・元のファイルに上書き・${en}）`
    :how==="保存"?`保存しました（${hm}・${en}）`
    :`ダウンロードしました（${hm}・${en}）。この端末では元のファイルに上書きできないので、ダウンロード先に保存されています`;
  updateMarks(); apply();
}
async function writeTo(h,bytes){
  if(h.queryPermission){
    let p=await h.queryPermission({mode:"readwrite"});
    if(p!=="granted") p=await h.requestPermission({mode:"readwrite"});
    if(p!=="granted") throw new Error("ファイルへの書き込みが許可されませんでした");
  }
  const w=await h.createWritable(); await w.write(bytes); await w.close();
}
function download(bytes,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([bytes],{type:"application/octet-stream"}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
$("stage").addEventListener("wheel",e=>{if(!state.vert||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;e.preventDefault();$("stage").scrollLeft-=e.deltaY},{passive:false});
/* 追加書体：読み込んだフォントはこの端末のブラウザ内（IndexedDB）に保存 */
const famOf=n=>"uf"+[...n].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7).toString(36);
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("agilnote",1);r.onupgradeneeded=()=>r.result.createObjectStore("fonts");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function addFont(name,buf){
  const fam=famOf(name);
  const ff=new FontFace(fam,buf);await ff.load();document.fonts.add(ff);
  if(![...$("face").options].some(o=>o.value==="u:"+fam)){
    const o=document.createElement("option");o.value="u:"+fam;o.textContent=name.replace(/\.(ttf|otf|woff2?)$/i,"");$("face").appendChild(o);
  }
  return fam;
}
$("fontIn").onchange=async e=>{
  let last=null;
  for(const f of e.target.files){
    try{const buf=await f.arrayBuffer();last=await addFont(f.name,buf);
      try{const db=await idb();db.transaction("fonts","readwrite").objectStore("fonts").put(buf,f.name)}catch(_){}}
    catch(err){$("fname").textContent=`${f.name} は書体として読み込めませんでした`}
  }
  if(last){state.face="u:"+last;apply()}
  e.target.value="";
};
$("fontClear").onclick=async()=>{
  try{const db=await idb();db.transaction("fonts","readwrite").objectStore("fonts").clear()}catch(_){}
  [...$("face").options].filter(o=>o.value.startsWith("u:")).forEach(o=>o.remove());
  if(state.face.startsWith("u:")) state.face="min";
  apply();
};
async function loadStoredFonts(){
  try{
    const db=await idb();const st=db.transaction("fonts").objectStore("fonts");
    const keys=await new Promise((r,j)=>{const q=st.getAllKeys();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
    for(const k of keys){
      const buf=await new Promise((r,j)=>{const q=db.transaction("fonts").objectStore("fonts").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
      try{await addFont(k,buf)}catch(_){}
    }
  }catch(_){}
  if(state.face.startsWith("u:") && ![...$("face").options].some(o=>o.value===state.face)) state.face="min";
  apply();
}
resetEditor();apply();toStart();
loadStoredFonts();
/* Windowsの「このアプリで開く」から渡されたファイル */
if("launchQueue" in window){launchQueue.setConsumer(async p=>{if(p.files&&p.files.length){const h=p.files[0];loadFile(await h.getFile(),h)}})}
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
